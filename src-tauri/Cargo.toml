[package]
name = "linux-voice-flow"
version = "0.1.0"
description = "Local push-to-talk dictation for Linux Mint X11"
edition = "2021"
rust-version = "1.90"

[lib]
name = "linux_voice_flow"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "linux-voice-flow"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-global-shortcut", "native-audio"]
native-audio = ["dep:cpal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-global-shortcut = { version = "2", optional = true }

tokio = { version = "1", features = ["process", "rt", "sync", "time", "io-util", "macros"] }
rubato = "=0.16.2"
hound = "3.5"
zeroize = "1"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
cpal = { version = "=0.16.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
